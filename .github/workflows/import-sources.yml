          313203957197800a1dfa954cfde84103be12bcd8e33aeee07be04216002b2e6d vendor/three.module.js
          f2f221673a5fe39168c858c47bf32a13627bb9405d84ef558e1166e687cd39b0 waterfront-life.js
          CHECKSUMS
          while read -r checksum file; do
            curl --fail --silent --show-error --location --retry 3 "https://html-classic.itch.zone/html/20686603/$file" -o "$file"
          done < "$RUNNER_TEMP/checksums"
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          footer = b'<script defer src="https://static.itch.io/htmlgame.js" type="text/javascript"></script>\n'
          page.write_bytes(page.read_bytes().removesuffix(footer))
          PY
          sha256sum --check "$RUNNER_TEMP/checksums"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md index.html arcade.css *.js vendor/
          git commit -m 'Publish the verified Grid Shift Free Flight release sources'
          git push origin HEAD:main
